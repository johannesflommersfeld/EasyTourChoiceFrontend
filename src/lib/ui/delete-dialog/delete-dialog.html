<div class="dialog">
  <h2 mat-dialog-title> 
    <mat-icon>
      warning
    </mat-icon>
    Warning
  </h2>
  <mat-dialog-content>
    <p>Are you sure you want to delete this tour?</p>
    <p>This action is not reversible!</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-flat-button [mat-dialog-close]="false" cdkFocusInitial>Cancel</button>
    <button mat-flat-button [mat-dialog-close]="true" class="warn">Delete</button>
  </mat-dialog-actions>
</div>
