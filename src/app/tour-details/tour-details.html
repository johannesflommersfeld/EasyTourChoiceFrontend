<div class="tour">
  <!-- Loading screen that shows while data is loading -->
  @if (tour.isLoading()) {
    <div class="loading-container">
      <mat-spinner></mat-spinner>
      <div class="loading-text">Loading tour details...</div>
    </div>
  }
  @else {
    <button mat-icon-button (click)="onEditTour()">
       <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button (click)="onDeleteTour()">
       <mat-icon>delete</mat-icon>
    </button>

    <app-aspect-indicator class="aspect-indicator-small"
      [value]="getAspects()"></app-aspect-indicator>
  }

  @if (weatherForecast.hasValue()) {
    <h2>Weather Forecast</h2>
    <app-weather-report-scroller [weatherForecast]="weatherForecast.value()"/>
  }

  @if (avalancheReport.hasValue()) {
    <h2>Avalanche Report - {{ avalancheReport.value().publicationTime | time }}</h2>
    <app-avalanche-report-scroller [bulletin]="avalancheReport.value()"/>
  }
